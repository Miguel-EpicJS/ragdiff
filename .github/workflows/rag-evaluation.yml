name: RAG evaluation

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  retrieval-regression:
    name: Retrieval regression gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked environment
        run: uv sync --locked --extra dev --python 3.12

      - name: Compare retrieval runs
        run: >-
          uv run --locked ragdiff
          --dataset examples/evaluation/dataset.json
          --baseline examples/evaluation/baseline.json
          --candidate examples/evaluation/candidate.json
          --output ragdiff-report.json
          --k 10

      - name: Publish pull request summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- ragdiff-evaluation -->";
            if (!fs.existsSync("ragdiff-report.json")) {
              core.setFailed("evaluation report was not generated");
              return;
            }
            const report = JSON.parse(fs.readFileSync("ragdiff-report.json", "utf8"));
            const escapeMarkdown = (value) =>
              String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll("`", "\\`");
            const summary = report.comparison.summary;
            const reasons = report.deployment_reasons.length
              ? report.deployment_reasons.map((reason) => `- ${escapeMarkdown(reason)}`).join("\n")
              : "- none";
            const body = [
              marker,
              "## RAGDiff retrieval evaluation",
              "",
              `**Deployment status:** \`${report.deployment_status}\``,
              "",
              `Regressions: **${summary.regressions}** · Improvements: **${summary.improvements}** · Incomplete: **${summary.incomplete}**`,
              "",
              "Decision evidence:",
              reasons,
              "",
              "The complete JSON report is available in the `ragdiff-evaluation-report` workflow artifact.",
            ].join("\n");
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number }
            );
            const existing = comments.find((comment) =>
              comment.user.type === "Bot" && comment.body.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ragdiff-evaluation-report
          path: ragdiff-report.json
          if-no-files-found: error
