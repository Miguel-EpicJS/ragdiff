<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RAGDiff Report</title>
    <link rel="stylesheet" href="/ui/styles.css">
  </head>
  <body>
    <main class="shell">
      <header>
        <p class="eyebrow">RAGDIFF</p>
        <h1>Retrieval regression report</h1>
        <p class="lede">Compare a candidate pipeline against a baseline and inspect the evidence before deployment.</p>
      </header>

      <section class="card">
        <form id="comparison-form">
          <label>
            Bearer token
            <input id="token" type="password" autocomplete="off" required placeholder="Paste a development token">
          </label>
          <label>
            Comparison request JSON
            <textarea id="request" rows="18" spellcheck="false" required></textarea>
          </label>
          <button type="submit">Run comparison</button>
          <p id="error" class="error" role="alert" hidden></p>
        </form>
      </section>

      <section id="report" class="card" hidden>
        <div class="report-heading">
          <div>
            <p class="eyebrow">DECISION</p>
            <h2 id="decision"></h2>
          </div>
          <span id="report-id" class="badge"></span>
        </div>
        <div class="summary" id="summary"></div>
        <h3>Measured comparison</h3>
        <pre id="details"></pre>
      </section>
    </main>
    <script src="/ui/app.js" defer></script>
  </body>
</html>
